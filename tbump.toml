github_url = "https://github.com/kratsg/claude-session-replays/"

[version]
current = "1.0.0"

# Semantic versioning for the player: MAJOR.MINOR.PATCH
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  '''

[git]
message_template = "chore: release player {new_version}"
tag_template = "player-v{new_version}"

# Files to update with new version
[[file]]
src = "player/app.js"
search = "var PLAYER_VERSION = '{current_version}';"

[[file]]
src = "pixi.toml"
search = 'version = "{current_version}"'
