<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session replay</title>
<meta name="description" content="A scrollable replay of a real Claude Code session, with commentary and every tool call expandable.">
<meta name="theme-color" content="#0a0c10">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt" crossorigin="anonymous" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" integrity="sha384-Z3REaz79l2IaAZqJsSABtTbhjgOUYyV3p90XNnAPCSHg3EMTz1fouunq9WZRtj3d" crossorigin="anonymous" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous" defer></script>
<!-- Generated by tools/build_site.py for file:// viewing; when it is missing, app.js fetches the JSON files instead. -->
<script src="data.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#replay">Skip to the replay</a>

<div id="app" aria-live="polite">
  <p class="loading">Loading the session…</p>
</div>

<div class="playbar" id="playbar" role="region" aria-label="Playback controls" hidden>
  <button type="button" class="pb-play" id="pb-play" aria-label="Play">
    <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
    <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
  </button>
  <div class="pb-speeds" role="group" aria-label="Playback speed">
    <button type="button" data-speed="1" aria-pressed="true">1×</button>
    <button type="button" data-speed="4" aria-pressed="false">4×</button>
    <button type="button" data-speed="16" aria-pressed="false">16×</button>
    <button type="button" data-speed="inf" aria-pressed="false">instant</button>
  </div>
  <div class="pb-ff" id="pb-ff" aria-hidden="true"></div>
  <div class="pb-scrub">
    <input type="range" id="pb-range" min="0" max="1" step="any" value="0" aria-label="Position in the session">
    <div class="pb-ticks" id="pb-ticks"></div>
  </div>
  <span class="pb-clock" id="pb-clock" aria-hidden="true">--:--</span>
</div>
</body>
</html>
